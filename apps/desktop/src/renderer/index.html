<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- No remote origins: the renderer is sandboxed and every byte it shows
         arrives over the preload bridge, so nothing may be loaded or connected
         to from the page itself. `style-src` allows inline styles because React
         and Recharts set `style` attributes; nothing else here parses HTML, so
         no server string can reach a style attribute. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'"
    />
    <title>Ranksta’s Paradise</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
